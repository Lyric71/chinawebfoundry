# The harness host list. An editorial asset, versioned and reviewed.
# Seed set from PLAN.md section 3.6, 6 September 2026.
#
# Fields per host:
#   host        hostname, or hostname/path when a specific file is the test
#   dependency  the product name as it appears in published tables
#   category    fonts-cdn | analytics | forms-chat | embeds | maps | platforms | edge-hosting | wordpress | control
#   path        optional request path (default /). Use a real asset where a marketing page would mislead.
#   priority    true for the F42 set that has no test record yet, and the two stale verdicts
#   notes       anything that limits how a verdict can be read
#
# Rules: never remove a host for producing an inconvenient result. Note the
# reason for every change in the commit message. Check the probe provider
# against this list before every change (probe co-location).

version: 1
updated: 2026-09-06
slow_threshold_ms:
  default: 1000
  fonts-cdn: 800
  analytics: 1000
  forms-chat: 1000
  embeds: 1500
  maps: 1000
  platforms: 1500
  edge-hosting: 1000
  wordpress: 1500
  control: 500

hosts:
