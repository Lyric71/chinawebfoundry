# Submit changed URLs to IndexNow (Bing, Yandex, Naver, Seznam) after every
# successful Vercel production deploy. Vercel's GitHub integration posts the
# deployment status that triggers this. See scripts/submit-indexnow.mjs.
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The previous run's sitemap snapshot. Cache keys are immutable, so each
      # run saves under its own key and the next run restores the newest one.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-snapshot-${{ github.run_id }}
          restore-keys: indexnow-snapshot-

      - name: Submit changed URLs
        run: node scripts/submit-indexnow.mjs --changed --snapshot .indexnow/sitemap.json

      - uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-snapshot-${{ github.run_id }}
